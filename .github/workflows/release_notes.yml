name: Release notes

# Merging a PR releases it, the PR description's "Release notes" section becomes the GitHub release notes
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Check release notes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the PR description has release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/release_notes.py check
