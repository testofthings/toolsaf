name: Release

# Every push to main is released to PyPI and GitHub Releases
# The patch version is incremented automatically, edit VERSION to start a new minor or major version
on:
  push:
    branches:
      - main

# Release one push at a time, so that two quick merges never get the same version
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  checks:
    name: Code checks
    permissions:
      contents: read
    uses: ./.github/workflows/code_check.yml

  prepare:
    name: Version and release notes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Calculate next version
        id: version
        run: |
          major_minor=$(sed -n 's/^version=\([0-9]\+\.[0-9]\+\)\.x$/\1/p' VERSION)
          if [ -z "$major_minor" ]; then
            echo "::error::VERSION must contain version=<major>.<minor>.x"
            exit 1
          fi

          previous=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          last=$(git tag --list "${major_minor}.*" --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            version="${major_minor}.0"
          else
            version="${major_minor}.$((${last##*.} + 1))"
          fi

          if [ "$(printf '%s\n%s\n' "$previous" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::Version $version is not newer than the latest release $previous, check VERSION"
            exit 1
          fi

          echo "Releasing $version, previous release $previous"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Collect release notes from merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          python3 .github/scripts/release_notes.py collect "$PREVIOUS" "$GITHUB_SHA" > release-notes.md
          echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$VERSION" >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build distribution
    needs: [checks, prepare]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # setuptools-scm takes the version from the tag. The tag is pushed only after publishing
      - name: Build sdist and wheel
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git tag "$VERSION"
          python -m pip install build
          python -m build
          ls dist/"toolsaf-$VERSION.tar.gz" dist/"toolsaf-$VERSION-py3-none-any.whl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/toolsaf/${{ needs.prepare.outputs.version }}/
    permissions:
      # PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Tag and GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file artifacts/release-notes/release-notes.md
